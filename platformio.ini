; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = main

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Pin the port by its stable by-id symlink (survives ttyUSB0/ttyUSB1 renumbering
; and never selects /dev/ttyS0). This is the FTDI adapter on this Nano. If you
; use a different board, update the id (ls -l /dev/serial/by-id/).
upload_port = /dev/serial/by-id/usb-FTDI_USB_Serial_Converter_FTB6SPL3-if00-port0
monitor_port = /dev/serial/by-id/usb-FTDI_USB_Serial_Converter_FTB6SPL3-if00-port0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -fno-exceptions
build_src_flags = -Wall -Wextra -Werror
lib_deps = robtillaart/INA219@^0.4.2

[env:buttons_test]
build_src_filter = -<*> +<buttons_test/>

[env:i2c_scan]
build_src_filter = -<*> +<i2c_scan/>

; === Final firmware: manual mode (main + shared modules) ===
[env:main]
build_src_filter = -<*> +<main/> +<buttons.cpp> +<motor_driver.cpp> +<current_sensor.cpp> +<motion_controller.cpp>

; === motor_test tool: slower, with timeout and verbose Serial log ===
[env:motor_test]
build_src_filter = -<*> +<motor_test/> +<buttons.cpp> +<motor_driver.cpp> +<current_sensor.cpp> +<motion_controller.cpp>

[env:ina_test]
build_src_filter = -<*> +<ina_test/>
lib_deps = robtillaart/INA219@^0.4.2
