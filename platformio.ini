; Desk Controller - PlatformIO project
;
; Multiple environments ("env") = incremental implementation steps.
; In VSCode pick the environment from the bottom bar (or in the PlatformIO
; Project Tasks panel) and manually click Upload / Monitor.
;
; From the command line:
;   pio run -e buttons_test -t upload
;   pio device monitor -e buttons_test
;
; Step 0  -> buttons_test : 4-button diagnostics (Serial only, no motor)
; tool    -> i2c_scan     : I2C scanner + sensor model check (0xC0 -> 0xEE)
; Step 1  -> motor_test   : manual UP/DOWN, ramp, current protection
;
; Next steps (closed-loop, presets) will be added in later phases.

[platformio]
; Build only the button diagnostics by default so a plain "Build" is safe.
default_envs = buttons_test

; --- Settings shared by all environments ---
[env]
platform = atmelavr
; Nano clones (CH340) often have the OLD bootloader -> upload at 57600 baud.
;   board = nanoatmega328      -> upload 57600 (old bootloader)
;   board = nanoatmega328new   -> upload 115200 (new bootloader)
; If upload reports "stk500_getsync() not in sync", switch between these two.
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Pin the Arduino USB-serial port. Without this PlatformIO may "auto-detect"
; /dev/ttyS0 (the motherboard COM port) and the upload goes nowhere.
; If the port changes after re-login / a different cable (e.g. ttyUSB1), edit here.
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -fno-exceptions
; -Werror only for our code in src/ (not libraries).
; If a warning in our code ever blocks the build, temporarily drop -Werror below.
src_build_flags = -Wall -Wextra -Werror

; Note on build_src_filter:
;   Shared modules (MotorDriver, Buttons, CurrentSensor, MotionController) live
;   in the src/ root. Each environment includes ONLY its own main plus the
;   modules it needs. PlatformIO builds everything in src/ by default, so we
;   first exclude everything (-<*>) and then include selected paths.

; === Step 0: button diagnostics (standalone, no modules) ===
[env:buttons_test]
build_src_filter = -<*> +<buttons_test/>

; === Tool: I2C scanner + sensor ID (standalone) ===
[env:i2c_scan]
build_src_filter = -<*> +<i2c_scan/>

; === Step 1: motor test (main + modules from src/ root) ===
[env:motor_test]
build_src_filter = -<*> +<motor_test/> +<buttons.cpp> +<motor_driver.cpp> +<current_sensor.cpp> +<motion_controller.cpp>
